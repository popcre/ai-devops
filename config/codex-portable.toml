# Portable Codex defaults for a new machine.
# setup-machine.ps1 copies this file only when ~/.codex/config.toml is absent.
# Established configs are never overwritten or given duplicate TOML keys.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
approval_policy = "never"

# Bound the always-loaded skill catalog in the Windows GUI without removing
# installed skills or their explicit invocation paths.
[skills]
max_context_tokens = 2000

[windows]
sandbox = "elevated"
