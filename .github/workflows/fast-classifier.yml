name: fast-classifier

# Selection and fast validation are deliberately separate outcomes (P3).
# Selection answers "which expensive suites can this change break?" and is
# conservative whenever it is uncertain. Fast validation answers "is this
# candidate even runnable?" and a known terminal failure there must start no
# long job at all. The publish job always runs so the caller always receives an
# explicit selection_result and validation_result; a missing result is never
# read as success.
on:
  workflow_call:
    outputs:
      run_long:
        value: ${{ jobs.publish.outputs.run_long }}
      prose_only:
        value: ${{ jobs.publish.outputs.prose_only }}
      skills:
        value: ${{ jobs.publish.outputs.skills }}
      code:
        value: ${{ jobs.publish.outputs.code }}
      workflow:
        value: ${{ jobs.publish.outputs.workflow }}
      powershell:
        value: ${{ jobs.publish.outputs.powershell }}
      test_fixtures:
        value: ${{ jobs.publish.outputs.test_fixtures }}
      reviewer:
        value: ${{ jobs.publish.outputs.reviewer }}
      selection_result:
        value: ${{ jobs.publish.outputs.selection_result }}
      validation_result:
        value: ${{ jobs.publish.outputs.validation_result }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_long: ${{ steps.classify.outputs.run_long }}
      prose_only: ${{ steps.classify.outputs.prose_only }}
      skills: ${{ steps.classify.outputs.skills }}
      code: ${{ steps.classify.outputs.code }}
      workflow: ${{ steps.classify.outputs.workflow }}
      powershell: ${{ steps.classify.outputs.powershell }}
      test_fixtures: ${{ steps.classify.outputs.test_fixtures }}
      reviewer: ${{ steps.classify.outputs.reviewer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # Disable rename detection so both the deleted source and added
            # destination are classified. A skills-to-docs rename must not
            # become a prose-only bypass.
            git diff --no-renames --name-only "$BASE_SHA" HEAD | bash tools/ci/classify-changes.sh pull_request >> "$GITHUB_OUTPUT"
          else
            bash tools/ci/classify-changes.sh "${{ github.event_name }}" </dev/null >> "$GITHUB_OUTPUT"
          fi

  # Fast validation, isolated from selection so that a known syntax or policy
  # failure can be reported as such and stop the expensive suites. These checks
  # run in seconds and are the whole fast-fail path: when they fail the change
  # is already known bad and a 45-105 minute suite can only re-report it.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bash syntax
        shell: bash
        run: |
          find bin tests tools -type f \( -name '*.sh' -o -path 'bin/ai-*' \) | while read -r file; do
            head -n 1 "$file" | grep -q 'bash' || continue
            bash -n "$file"
          done
      - name: Workflow policy
        run: bash tests/test-workflow-policy.sh
      - name: Suite selection
        run: bash tests/test-test-selection.sh

  # Always runs, even when select or validate failed, so the caller gets an
  # explicit result for each outcome instead of an empty string that could be
  # mistaken for a clean skip.
  publish:
    if: always()
    needs: [select, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run_long: ${{ needs.select.outputs.run_long }}
      prose_only: ${{ needs.select.outputs.prose_only }}
      skills: ${{ needs.select.outputs.skills }}
      code: ${{ needs.select.outputs.code }}
      workflow: ${{ needs.select.outputs.workflow }}
      powershell: ${{ needs.select.outputs.powershell }}
      test_fixtures: ${{ needs.select.outputs.test_fixtures }}
      reviewer: ${{ needs.select.outputs.reviewer }}
      selection_result: ${{ steps.record.outputs.selection_result }}
      validation_result: ${{ steps.record.outputs.validation_result }}
    steps:
      - name: Publish selection and validation results
        id: record
        run: |
          selection='${{ needs.select.result }}'
          validation='${{ needs.validate.result }}'
          case "$selection" in success|failure|cancelled|skipped) ;; *) selection=missing ;; esac
          case "$validation" in success|failure|cancelled|skipped) ;; *) validation=missing ;; esac
          {
            printf 'selection_result=%s\n' "$selection"
            printf 'validation_result=%s\n' "$validation"
          } >> "$GITHUB_OUTPUT"
          printf 'fast-classifier: selection=%s validation=%s run_long=%s\n' \
            "$selection" "$validation" '${{ needs.select.outputs.run_long }}'
