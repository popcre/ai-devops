name: runner-label-scan

# Step 3.1 (plan_ci-process-repair.md, #2367): flag every runs-on label across
# all popcre and u2giants workflows that matches no known hosted image, no
# routing-config label, and no registered runner. This is the check that
# would have caught a third-party runner removal leaving dead labels behind: jobs
# queued on a label with no runner look like waiting, not broken.
#
# This check is advisory. The reporter opens an issue for confirmed dead
# labels. Incomplete coverage stays visible in the scan summary.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 09:17 UTC, off the crowded boundaries.
    - cron: '17 9 * * 2'

permissions:
  contents: read

# Serialize the scheduled and dispatched runs that share one alert issue.
concurrency:
  group: runner-label-scan-alert-${{ vars.LANE_EPOCH || '0' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      exit-code: ${{ steps.scan.outputs.exit-code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan every popcre and u2giants workflow for dead runner labels
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          # This existing read-only credential is scoped to popcre/ai-devops.
          RUNNER_POOL_READ_TOKEN: ${{ secrets.RUNNER_POOL_READ_TOKEN }}
        run: |
          set +e
          node tools/ci/check-runner-labels.mjs | tee "$GITHUB_STEP_SUMMARY"
          statuses=("${PIPESTATUS[@]}")
          set -e
          scan_exit="${statuses[0]}"
          if [ "${statuses[1]}" -ne 0 ]; then
            scan_exit=2
          fi
          echo "exit-code=$scan_exit" >> "$GITHUB_OUTPUT"
          exit "$scan_exit"

  report:
    needs: scan
    if: >-
      always() && !cancelled() &&
      (needs.scan.outputs.exit-code == '0' || needs.scan.outputs.exit-code == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record confirmed dead labels or a clean scan
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_EXIT: ${{ needs.scan.outputs.exit-code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$SCAN_EXIT" in
            0) result=success ;;
            1) result=failure ;;
            *) exit 1 ;;
          esac
          bash tools/ci/report-scheduled-failure.sh \
            --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" \
            --per-test --results "runner-label-scan=$result"
