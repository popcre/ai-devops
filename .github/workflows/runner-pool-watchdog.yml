name: runner-pool-watchdog

# BACKUP ONLY. The primary runner-pool alarm is the local timed task
# `ai-runner-pool-watch` on the watchdog duty pool (docs/watchdog-duty-pool.md).
# This workflow is a weekly free-runner smoke and manual dispatch. It never
# uses a paid runner.
#
# Why the check comes from outside the pool: a heartbeat job would queue on the
# very pool it tests. A dead pool would leave it queued for ~24h.
#
# The blind spot this closes: `linux-offline` is the only required check on
# main, and Windows jobs are skipped on `merge_group`. A dead Windows pool does
# not block merging and produces no red signal — coverage silently disappears.
on:
  workflow_dispatch:
  schedule:
    # Weekly smoke (primary is hourly local on the 25th). Minute 25 keeps the
    # old slot for the backup.
    - cron: '25 14 * * 1'

permissions:
  contents: read

jobs:
  pool-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the qualified Windows runner pool has at least one online host
        env:
          # Listing self-hosted runners requires repository *administration*
          # rights, which the built-in GITHUB_TOKEN cannot be granted. The
          # fine-grained RUNNER_POOL_READ_TOKEN (Administration: Read-only)
          # is the existing credential. The tool reads RUNNER_POOL_READ_TOKEN;
          # GH_TOKEN is kept for ai-gh passthrough. Never log either token.
          RUNNER_POOL_READ_TOKEN: ${{ secrets.RUNNER_POOL_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.RUNNER_POOL_READ_TOKEN }}
        run: |
          set -euo pipefail
          bin/ai-runner-pool-watch check
