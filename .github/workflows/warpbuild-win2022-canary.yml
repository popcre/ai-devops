# Non-required canary for WarpBuild Azure BYOC Windows runners (issue #961).
# Manual only. Must NOT become a required check. Required CI stays on
# GitHub-hosted Windows; WarpBuild runs the required suite as the non-blocking
# windows-offline-warpbuild-proof lane in verify.yml (2026-10-01, #961).
# One job per BYOC stack so a single dispatch proves all three regions.
name: warpbuild-win2022-canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: windows-tooling-canary (${{ matrix.region }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: use1
            warp_label: warp-custom-warpbuild-win2022-canary
          - region: use2
            warp_label: warp-custom-warpbuild-win2022-use2
          - region: cus
            warp_label: warp-custom-warpbuild-win2022-cus
    runs-on: ${{ matrix.warp_label }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: OS and tooling
        shell: pwsh
        run: |
          Write-Host "region=${{ matrix.region }}"
          Write-Host "label=${{ matrix.warp_label }}"
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "os=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "arch=$env:RUNNER_ARCH"
          Write-Host "temp=$env:RUNNER_TEMP"
          git --version
          pwsh --version
          node --version
          bash --version | head -1
          Get-PSDrive C | Format-List

      - name: Terminate proof
        shell: pwsh
        run: |
          Write-Host "canary job completed (${{ matrix.region }}); runner should terminate after this job"
          exit 0
