# Non-required canary for WarpBuild Azure BYOC Windows runner (issue #961).
# Manual only. Must NOT become a required check. Required CI stays unmigrated
# until this canary passes and is reviewed.
name: warpbuild-win2022-canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: windows-tooling-canary
    runs-on: warp-custom-warpbuild-win2022-canary
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OS and tooling
        shell: pwsh
        run: |
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "os=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "arch=$env:RUNNER_ARCH"
          Write-Host "temp=$env:RUNNER_TEMP"
          git --version
          pwsh --version
          node --version
          bash --version | head -1
          Get-PSDrive C | Format-List

      - name: Terminate proof
        shell: pwsh
        run: |
          Write-Host "canary job completed; runner should terminate after this job"
          exit 0
