name: Merge-queue settings drift

# BACKUP ONLY. The primary merge-queue drift alarm is the local timed task
# `ai-merge-queue-drift tick` on the watchdog duty pool
# (docs/watchdog-duty-pool.md). This workflow stays for PR path checks and a
# weekly free-runner smoke. It never uses a paid runner.
#
# Catches a mismatch between the toolkit and GitHub's live merge-queue
# settings before it ejects pull requests for hours (#913, #1002 step 4).
# Not a required check: a red run is an alarm on one standing issue.
#
# The live ruleset read may be refused for the workflow token (repo ruleset
# reads can require administration). A refused read is DEGRADED, not drift.
on:
  workflow_dispatch:
  schedule:
    # Weekly smoke (primary is daily local at 07:23 America/New_York).
    - cron: '23 16 * * 1'
  pull_request:
    paths:
      - .github/workflows/**
      - tests/lib-selection.sh
      - config/merge-queue-expected.json
      - bin/ai-merge-queue-drift
      - tests/test-ai-merge-queue-drift.sh

permissions:
  contents: read

# A cron run and a manual dispatch must not race the same standing issue.
concurrency:
  group: merge-queue-drift-alert
  cancel-in-progress: false

jobs:
  drift:
    name: Offline drift checks hold
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline drift checks and suite
        run: |
          bash tests/test-ai-merge-queue-drift.sh
          bin/ai-merge-queue-drift --offline

  live-ruleset:
    name: Snapshot matches the live ruleset
    # Enabled by the #1026 item 4 owner decision (MERGE_QUEUE_DRIFT_LIVE).
    # The job token cannot read rulesets under contents:read, so the lane reads
    # through the repository's existing scoped administration token.
    if: github.event_name != 'pull_request' && vars.MERGE_QUEUE_DRIFT_LIVE == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      outcome: ${{ steps.live.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the live ruleset
        id: live
        env:
          # RUNNER_POOL_READ_TOKEN: fine-grained, scoped to popcre/ai-devops,
          # Administration: Read-only (same shape runner-pool-watchdog needs).
          GH_TOKEN: ${{ secrets.RUNNER_POOL_READ_TOKEN || github.token }}
        run: |
          ruleset_id="$(jq -r .ruleset_id config/merge-queue-expected.json)"
          repo="$(jq -r .repository config/merge-queue-expected.json)"
          if ! bin/ai-gh api "repos/$repo/rulesets/$ruleset_id" > /tmp/ruleset.json 2>/tmp/read.err; then
            # GitHub answers 404 both for a deleted ruleset and for a token not
            # allowed to see it. Booking deletion needs TWO proofs (see #1026).
            if grep -q 'HTTP 404' /tmp/read.err &&
               bin/ai-gh api "repos/$repo/actions/runners?per_page=1" > /dev/null 2>&1 &&
               bin/ai-gh api --paginate "repos/$repo/rulesets?per_page=100" --jq '.[].id' > /tmp/ids.txt 2>/dev/null &&
               ! grep -qx "$ruleset_id" /tmp/ids.txt; then
              echo "outcome=drift" >> "$GITHUB_OUTPUT"
              echo "the live ruleset $ruleset_id no longer exists" >&2
              exit 1
            fi
            echo "outcome=refused" >> "$GITHUB_OUTPUT"
            echo "::warning::live ruleset read was refused; offline checks stay in force"
            sed -n '1,4p' /tmp/read.err || true
            exit 0
          fi
          if bin/ai-merge-queue-drift --ruleset /tmp/ruleset.json; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  alert:
    needs: [drift, live-ruleset]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.drift.result != 'success' || needs.live-ruleset.result == 'failure' || needs.live-ruleset.outputs.outcome == 'refused')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - name: Open or update the merge-queue drift standing issue
        shell: bash
        run: |
          if [ -x bin/ai-gh ]; then GHX=bin/ai-gh; else GHX=gh; fi
          outcome="${{ needs.live-ruleset.outputs.outcome }}"
          if [ "$outcome" = refused ] && [ "${{ needs.drift.result }}" = success ]; then
            title='Merge-queue drift lane degraded - live ruleset read refused'
            body="The live ruleset comparison could not read repos/$GITHUB_REPOSITORY at $RUN_URL (token refused the ruleset read). The offline checks stay in force. Check that the RUNNER_POOL_READ_TOKEN secret still carries Administration: Read-only (the same permission runner-pool-watchdog.yml depends on); until then scheduled runs are degraded, and this message will not repeat while it is the latest comment."
          else
            title='Merge-queue drift check failed'
            body="The merge-queue drift check failed at $RUN_URL. Run bin/ai-merge-queue-drift for the exact finding, then reconcile it by a pull request to config/merge-queue-expected.json or by reverting the live ruleset. Close this issue only after a later drift run passes."
          fi
          existing="$("$GHX" issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ "$outcome" = refused ] && [ -n "$existing" ]; then
            last="$("$GHX" issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments --jq '.body, (.comments[-1].body // "")' 2>/dev/null)"
            if [ "$(printf '%s' "$last" | grep -c 'will not repeat while it is the latest comment')" -ge 1 ]; then
              echo "refusal already reported; staying silent"
              exit 0
            fi
          fi
          if [ -n "$existing" ]; then
            "$GHX" issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            "$GHX" issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug
          fi
