name: Reusable Markdown reachability

on:
  workflow_call:

jobs:
  docs-reachability:
    name: New docs are reachable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the shared checker
        uses: actions/checkout@v4
        with:
          repository: u2giants/ai-devops
          ref: main
          path: .doc-reachability-tool

      - name: Block unreachable added or moved Markdown
        env:
          DOC_REACHABILITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 .doc-reachability-tool/bin/ai-doc-reachability
          --repo "$GITHUB_WORKSPACE"
