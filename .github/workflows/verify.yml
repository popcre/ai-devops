name: verify

on:
  pull_request:
  # Required for the merge queue: without this trigger a queued pull request
  # waits forever for checks that never start.
  merge_group:
  workflow_dispatch:
    inputs:
      requester_task:
        description: Originating task or session
        required: true
        type: string
      purpose:
        description: Why this verification is needed
        required: true
        type: string
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  # A pull request is keyed on its *number*, not its head SHA. Keying on the SHA
  # made every new commit its own group, so cancel-in-progress could never fire
  # across pushes and the two-runner Windows pool filled with builds nobody was
  # waiting for (issue #204: nine queued runs for six commits on one branch).
  #
  # merge_group keeps its own per-queue-branch group. Manual verification keeps
  # its immutable source SHA, so duplicate requests serialize without destroying
  # the active proof.
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && github.ref || github.sha }}
  # New commits may supersede obsolete PR proof. Manual evidence must never be
  # destroyed by another start.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  manual-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run_expensive_jobs: ${{ steps.decide.outputs.run_expensive_jobs }}
    steps:
      - name: Record provenance and reuse complete exact-SHA proof
        id: decide
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'verify.yml';
            const current = context.runId;
            const sha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id, event: 'workflow_dispatch', status: 'completed', per_page: 100
            });
            const reusable = runs.find(run =>
              run.id !== current && run.head_sha === sha && run.conclusion === 'success'
            );
            const decision = reusable ? `reuse run ${reusable.id}` : 'run complete verification';
            core.setOutput('run_expensive_jobs', reusable ? 'false' : 'true');
            await core.summary
              .addHeading('Manual verification provenance')
              .addTable([
                [{data: 'Source SHA', header: true}, sha],
                [{data: 'Requester task', header: true}, context.payload.inputs.requester_task],
                [{data: 'Purpose', header: true}, context.payload.inputs.purpose],
                [{data: 'Decision', header: true}, decision]
              ]).write();

  fast-classifier:
    uses: ./.github/workflows/fast-classifier.yml

  linux-offline:
    needs: [fast-classifier, manual-preflight, merge-group-evidence]
    if: ${{ !cancelled() && needs.merge-group-evidence.result == 'success' && (needs.fast-classifier.result != 'success' || needs.fast-classifier.outputs.run_long == 'true') && (github.event_name != 'workflow_dispatch' || needs.manual-preflight.outputs.run_expensive_jobs == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install offline test dependencies
        run: |
          # The runner image carries unrelated third-party feeds. A transient
          # Chrome index mismatch ejected this exact head from the merge queue
          # three times before project tests started (runs 34385010191,
          # 34385198205, and 34385457668). These tools come from Ubuntu, so
          # refresh only Ubuntu's signed source and leave the other feeds alone.
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=-
          sudo apt-get install -y jq ripgrep shellcheck
      - name: Syntax
        run: |
          find bin tests -type f \( -name '*.sh' -o -path 'bin/ai-*' \) | while read -r file; do
            head -n 1 "$file" | grep -q 'bash' || continue
            bash -n "$file"
          done
      - name: Complete offline Bash suite
        run: bash tests/test-all.sh

  # The queue gate is deliberately light: #204 took the long Windows jobs off
  # merge_group because a required check that never reports on a merge group
  # hangs every entry for the full 120-minute check_response_timeout. That trade
  # left the Windows proof resting on the pull-request run of the queued head
  # commit, with nothing checking that it existed, matched the commit, finished,
  # or passed. This job checks exactly that, in seconds, so the queue keeps its
  # measured p90 of about 12 minutes while stale, missing or mismatched evidence
  # can no longer merge. It is fail-closed: an error exits non-zero rather than
  # letting the change through.
  merge-group-evidence:
    # Runs on every event on purpose. A required check that reports on one event
    # and stays silent on the other is the #204 failure in either direction: a
    # merge group waits out the 120-minute response timeout, or a pull request
    # can never satisfy a context that never reports. Outside the queue this job
    # says so and passes in seconds, so one stable context covers both.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Queued commit carries its own full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != 'merge_group' ]; then
            echo 'Not a merge-queue run: the queued-commit evidence check applies to merge groups only.'
            exit 0
          fi
          bash bin/ai-merge-group-evidence --ref "${{ github.ref }}" --merge-group-sha "${{ github.sha }}" --repo "${{ github.repository }}" --require windows-offline --require windows-reviewer-safety --require injected-failure-proof

  # Ordinary pull requests divide the Windows-sensitive lane into four declared,
  # balanced sections that run at the same time on four independent GitHub-hosted
  # machines (#210). Hosted concurrency is unmetered on a public repository, so
  # this is real parallelism on separate hardware, not four processes competing
  # for one desktop - the failure mode the issue explicitly forbids. The section
  # boundaries live in config/ci-suite-manifest.json and are sized from the
  # measured per-suite timings of runs 34394706703, 34377910065 and 34366159903;
  # tests/test-all.sh refuses to run a section unless the declared sections
  # reconstitute the whole lane exactly, so a coverage gap is a configuration
  # error rather than a quiet pass.
  windows-offline-section:
    needs: [fast-classifier, manual-preflight]
    # Not run on merge_group: linux-offline is the queue gate, and the Windows
    # proof comes from the pull_request run on the exact head commit (#204).
    # Also skipped when the fast classifier proves the change is prose-only.
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs every section.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true')
    strategy:
      # One failing section must never hide the result of the other three:
      # the whole point of sectioning is that a useful failure arrives early
      # and the rest of the evidence still lands.
      fail-fast: false
      matrix:
        section: [1, 2, 3, 4]
    runs-on: windows-2025
    # The longest single suite in the lane, test-ai-kimi.sh, measured 1,048-1,098
    # seconds across the three sampled runs, and it alone sets the floor for any
    # section: no split can make a section shorter than its slowest indivisible
    # suite. Four sections put the measured worst section at about 18.3 minutes
    # against the issue's 20-minute p90 bound, with hosted checkout overhead
    # measured at roughly 15 seconds. This 35-minute ceiling is sized to bound a
    # genuine hang with headroom over that worst section; it is not a target.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Windows-sensitive section ${{ matrix.section }} of 4
        shell: pwsh
        run: |
          .\tests\test-all.ps1 -WindowsPullRequest -ExcludeReviewerSafety -Shard '${{ matrix.section }}/4'

  # Scheduled, manual and qualification verification stay complete and
  # unsectioned. Sectioning is a wall-clock lever for the pull-request lane; the
  # backstop that proves every suite in one place must not depend on the section
  # mapping being correct.
  windows-offline-complete:
    needs: [fast-classifier, manual-preflight]
    # Not run on merge_group: linux-offline is the queue gate, and the Windows
    # proof comes from the pull_request run on the exact head commit (#204).
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs the complete matrix.
    if: >-
      !cancelled() && github.event_name != 'merge_group' &&
      github.event_name != 'pull_request' &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true')
    # GitHub-hosted, on purpose. Self-hosted capacity was added to this
    # repository to have MORE Windows capacity, not to move off GitHub's
    # runners: hosted concurrency is unmetered on a public repository, so this
    # long matrix never waits for a machine. It ran on windows-2025 from
    # 2026-04 until 2026-08-29 without a runner-caused failure. Routing it to
    # the single-host self-hosted pool on 2026-09-02 serialised the whole
    # repository behind one desktop and left fourteen verify runs queued at
    # once. The self-hosted lane keeps windows-reviewer-safety below, where a
    # timing flake can be reproduced on a known physical machine.
    runs-on: windows-2025
    # Measured 2026-09-02 on the complete suites, not estimated. Hosted
    # windows-2025: 73m23s complete (run 33658549626) and one run cancelled by
    # the old 75-minute ceiling at 75m11s (run 33675127243). Self-hosted
    # EDGE-RUNN-ENVY over four runs the same day: 58m40s to 62m18s. This
    # ceiling is sized from those measurements to bound a genuine hang; it is
    # NOT a target. #166 must set the required-check ceiling from a completed
    # run rather than from this bound.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Complete offline Windows and Bash suites
        shell: pwsh
        run: |
          .\tests\test-all.ps1

  # One stable aggregate result for the whole Windows offline lane, whatever
  # shape that lane took for this event. The name is deliberately unchanged so
  # #166 can restore `windows-offline` as a required context without having to
  # know how many sections exist. It is fail-closed: a section that did not
  # report success fails the aggregate, and `skipped` is accepted only when the
  # fast classifier actually proved the change was prose-only.
  windows-offline:
    needs: [fast-classifier, manual-preflight, windows-offline-section, windows-offline-complete]
    if: >-
      !cancelled() && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate the Windows offline lane
        env:
          EVENT: ${{ github.event_name }}
          CLASSIFIER_RESULT: ${{ needs.fast-classifier.result }}
          RUN_LONG: ${{ needs.fast-classifier.outputs.run_long }}
          RUN_EXPENSIVE: ${{ needs.manual-preflight.outputs.run_expensive_jobs }}
          SECTION_RESULT: ${{ needs.windows-offline-section.result }}
          COMPLETE_RESULT: ${{ needs.windows-offline-complete.result }}
        run: |
          set -uo pipefail
          printf 'event=%s classifier=%s run_long=%s sections=%s complete=%s\n' \
            "$EVENT" "$CLASSIFIER_RESULT" "$RUN_LONG" "$SECTION_RESULT" "$COMPLETE_RESULT"

          # A legitimate whole-lane skip: the classifier succeeded and proved the
          # change is prose-only, or a manual run declined the expensive jobs.
          prose_only=false
          if [ "$CLASSIFIER_RESULT" = 'success' ] && [ "$RUN_LONG" != 'true' ]; then
            prose_only=true
          fi
          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$RUN_EXPENSIVE" != 'true' ]; then
            prose_only=true
          fi

          if [ "$EVENT" = 'pull_request' ]; then
            lane_result="$SECTION_RESULT"
            lane_name='the four Windows sections'
          else
            lane_result="$COMPLETE_RESULT"
            lane_name='the complete Windows matrix'
          fi

          if [ "$lane_result" = 'success' ]; then
            printf 'windows-offline: %s succeeded.\n' "$lane_name"
            exit 0
          fi
          if [ "$lane_result" = 'skipped' ] && [ "$prose_only" = true ]; then
            printf 'windows-offline: %s was skipped because the change is prose-only.\n' "$lane_name"
            exit 0
          fi
          printf 'windows-offline: %s reported %s; failing closed.\n' "$lane_name" "$lane_result" >&2
          exit 1

  windows-reviewer-safety:
    needs: [fast-classifier, manual-preflight]
    # Not run on merge_group: linux-offline is the queue gate, and the Windows
    # proof comes from the pull_request run on the exact head commit (#204).
    # Also skipped when the fast classifier proves the change is prose-only.
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs the complete matrix.
    if: >-
      !cancelled() && github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true')
    # Self-hosted on the qualified pool. Moving this job
    # to the GitHub-hosted windows-2025 image was tried on 2026-09-02 and
    # stalled (#204), so this is not a return to hosted runners: it is a move
    # to a dedicated, qualified, otherwise idle machine. The reviewer suite
    # passed 199 of 199 checks in 538s on EDGE-RUNN-ENVY in qualification run
    # 33571202823 - well inside the 30 minute ceiling it exceeded while
    # sharing the edge-dev desktop with windows-offline.
    runs-on: [self-hosted, Windows, X64, ai-devops-windows-qualified]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline reviewer dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Focused Windows reviewer safety suites
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          $failures = 0
          foreach ($test in @('tests/test-ai-codex-review.sh', 'tests/test-ai-grok-review.sh')) {
            & $bash $test
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -ne 0) { exit 1 }

  reviewer-safety-start-deadline:
    needs: [fast-classifier, manual-preflight]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      fallback_required: ${{ steps.watch.outputs.fallback_required }}
    steps:
      - name: Bound the self-hosted reviewer lane start
        id: watch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const startDeadline = Date.now() + 10 * 60 * 1000;
            // A job may use the full 10-minute start allowance and its own
            // 30-minute execution ceiling. Keep both inside this deadline.
            const completionDeadline = Date.now() + 42 * 60 * 1000;
            while (Date.now() < completionDeadline) {
              const {data} = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100
              });
              const job = data.jobs.find(candidate => candidate.name === 'windows-reviewer-safety');
              if (job && job.status === 'completed') {
                const fallback = job.conclusion === 'success' ? 'false' : 'true';
                core.setOutput('fallback_required', fallback);
                core.info(`Reviewer lane completed conclusion=${job.conclusion}; fallback_required=${fallback}.`);
                return;
              }
              if ((!job || job.status === 'queued') && Date.now() >= startDeadline) {
                core.setOutput('fallback_required', 'true');
                core.warning('Reviewer lane did not start within 10 minutes; hosted fallback is required.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setOutput('fallback_required', 'true');
            core.warning('Reviewer lane did not complete within 42 minutes; hosted fallback is required.');

  windows-reviewer-fallback:
    needs: [fast-classifier, manual-preflight, reviewer-safety-start-deadline]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true') &&
      (needs['reviewer-safety-start-deadline'].result != 'success' ||
       needs['reviewer-safety-start-deadline'].outputs.fallback_required == 'true')
    runs-on: windows-2025
    # This is an emergency hosted path, not the qualified timing signal. Run
    # 34387666739 reached Grok but was killed by the original 30-minute bound;
    # prior hosted evidence measured Grok alone at 41m20s. Sixty minutes keeps
    # the fallback bounded without weakening any assertion.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run reviewer suites omitted from the hosted matrix
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          $failures = 0
          foreach ($test in @('tests/test-ai-codex-review.sh', 'tests/test-ai-grok-review.sh')) {
            & $bash $test
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -ne 0) { exit 1 }

  report-scheduled-failure:
    needs: [fast-classifier, linux-offline, windows-offline-complete, windows-reviewer-safety, windows-reviewer-fallback]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the scheduled verification incident
        shell: bash
        run: |
          title='Scheduled full verification is failing'
          body="The complete scheduled matrix failed at $RUN_URL. Diagnose the named failing job and close this issue only after a later complete scheduled run passes."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug
          fi
