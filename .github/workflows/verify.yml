name: verify

on:
  push:
    branches: [main]
  pull_request:
  # Required for the merge queue: without this trigger a queued pull request
  # waits forever for checks that never start.
  merge_group:
  workflow_dispatch:

concurrency:
  # push and pull_request: keep each immutable commit's proof alive when newer
  # work lands on main. Only a duplicate run for the same event and source SHA
  # is superseded.
  #
  # merge_group: the opposite rule applies. When a pull request merges ahead of
  # the queue, GitHub forms a NEW merge group and the previous candidate is
  # dead - but its ~66-minute windows-offline job keeps a windows-2025 runner
  # for the full timeout and starves the live candidate. Group merge_group runs
  # by the target branch so only the current candidate holds a runner.
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install offline test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck
      - name: Syntax
        run: |
          find bin tests -type f \( -name '*.sh' -o -path 'bin/ai-*' \) | while read -r file; do
            head -n 1 "$file" | grep -q 'bash' || continue
            bash -n "$file"
          done
      - name: Complete offline Bash suite
        run: bash tests/test-all.sh

  windows-offline:
    runs-on: windows-2025
    # The complete protected matrix measured about 62 minutes on windows-2025
    # after the 2026-08 reviewer expansions. Keep bounded failure plus headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Complete offline Windows and Bash suites
        shell: pwsh
        run: .\tests\test-all.ps1

  windows-reviewer-safety:
    runs-on: windows-2025
    # Never a required check, and a strict subset of windows-offline. Inside a
    # merge group it starts alongside the required job rather than ahead of it,
    # so it is not an early warning there - it only takes a second windows-2025
    # runner and reports failures that block nothing. It stays on pull_request,
    # where it is the fast signal docs/development.md asks for.
    if: github.event_name != 'merge_group'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline reviewer dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Focused Windows reviewer safety suites
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          $failures = 0
          foreach ($test in @('tests/test-ai-codex-review.sh', 'tests/test-ai-grok-review.sh')) {
            & $bash $test
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -ne 0) { exit 1 }
