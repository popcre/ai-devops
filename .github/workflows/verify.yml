name: verify

on:
  pull_request:
  # Required for the merge queue: without this trigger a queued pull request
  # waits forever for checks that never start.
  merge_group:
  workflow_dispatch:
    inputs:
      requester_task:
        description: Originating task or session
        required: true
        type: string
      purpose:
        description: Why this verification is needed
        required: true
        type: string
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  # A pull request is keyed on its *number*, not its head SHA. Keying on the SHA
  # made every new commit its own group, so cancel-in-progress could never fire
  # across pushes and the two-runner Windows pool filled with builds nobody was
  # waiting for (issue #204: nine queued runs for six commits on one branch).
  #
  # merge_group keeps its own per-queue-branch group. Manual verification keeps
  # its immutable source SHA, so duplicate requests serialize without destroying
  # the active proof.
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && github.ref || github.sha }}
  # New commits may supersede obsolete PR proof. Manual evidence must never be
  # destroyed by another start.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  manual-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    outputs:
      run_expensive_jobs: ${{ steps.decide.outputs.run_expensive_jobs }}
    steps:
      - name: Record provenance and reuse complete exact-SHA proof
        id: decide
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'verify.yml';
            const current = context.runId;
            const sha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id, event: 'workflow_dispatch', status: 'completed', per_page: 100
            });
            const reusable = runs.find(run =>
              run.id !== current && run.head_sha === sha && run.conclusion === 'success'
            );
            const decision = reusable ? `reuse run ${reusable.id}` : 'run complete verification';
            core.setOutput('run_expensive_jobs', reusable ? 'false' : 'true');
            await core.summary
              .addHeading('Manual verification provenance')
              .addTable([
                [{data: 'Source SHA', header: true}, sha],
                [{data: 'Requester task', header: true}, context.payload.inputs.requester_task],
                [{data: 'Purpose', header: true}, context.payload.inputs.purpose],
                [{data: 'Decision', header: true}, decision]
              ]).write();

  fast-classifier:
    uses: ./.github/workflows/fast-classifier.yml

  # The complete offline Bash suite, split into four sections that run at the
  # same time on separate hosted machines (docs/ci-speed-audit-2026-09-17.md,
  # speedup 2). tests/test-all.sh --balanced packs every discovered suite into
  # exactly one section by the measured seconds in config/ci-suite-manifest.json
  # (runs 35227802085, 35227474047, 35224512570: about 21 minutes serial); an
  # unmeasured suite still lands in a section at a default weight.
  #
  # Issue #805: a pull request runs only the suites its files can break. The
  # merge queue, schedule, and manual runs keep the complete inventory, so
  # main's safety does not change. Unknown paths still select every suite.
  linux-offline-shard:
    needs: [fast-classifier, manual-preflight]
    if: ${{ !cancelled() && needs.fast-classifier.outputs.validation_result != 'failure' && (needs.fast-classifier.outputs.selection_result != 'success' || needs.fast-classifier.outputs.run_long != 'false') && (github.event_name != 'workflow_dispatch' || needs.manual-preflight.outputs.run_expensive_jobs == 'true') }}
    strategy:
      # One failing section must never hide the other sections' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      SELECTION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install offline test dependencies
        run: |
          # The runner image carries unrelated third-party feeds. A transient
          # Chrome index mismatch ejected this exact head from the merge queue
          # three times before project tests started (runs 34385010191,
          # 34385198205, and 34385457668). These tools come from Ubuntu, so
          # refresh only Ubuntu's signed source and leave the other feeds alone.
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=-
          sudo apt-get install -y jq ripgrep shellcheck
      - name: Syntax
        if: ${{ matrix.shard == 1 }}
        run: |
          find bin tests -type f \( -name '*.sh' -o -path 'bin/ai-*' \) | while read -r file; do
            head -n 1 "$file" | grep -q 'bash' || continue
            bash -n "$file"
          done
      - name: Offline Bash suite section ${{ matrix.shard }} of 4
        run: |
          if [ -n "${SELECTION_BASE:-}" ]; then
            bash tests/test-all.sh --changed-since "$SELECTION_BASE" --balanced --shard '${{ matrix.shard }}/4'
          else
            bash tests/test-all.sh --balanced --shard '${{ matrix.shard }}/4'
          fi

  # The required check keeps its name. It passes only when every section passed
  # and the four sections reconstitute the whole suite exactly once; a failed,
  # cancelled, skipped or missing section fails it closed. Its run condition is
  # the sections' condition, so it is skipped only when they legitimately were.
  linux-offline:
    needs: [fast-classifier, manual-preflight, linux-offline-shard]
    if: ${{ !cancelled() && needs.fast-classifier.outputs.validation_result != 'failure' && (needs.fast-classifier.outputs.selection_result != 'success' || needs.fast-classifier.outputs.run_long != 'false') && (github.event_name != 'workflow_dispatch' || needs.manual-preflight.outputs.run_expensive_jobs == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      SELECTION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The aggregate re-derives the selected inventory from the PR base
          # SHA, so it needs the same full history the sections already fetch.
          fetch-depth: 0
      - name: Aggregate the offline Bash sections
        env:
          SHARD_RESULT: ${{ needs.linux-offline-shard.result }}
        run: |
          if [ -n "${SELECTION_BASE:-}" ]; then
            bash tools/ci/linux-offline-aggregate.sh "$SHARD_RESULT" 4 --changed-since "$SELECTION_BASE"
          else
            bash tools/ci/linux-offline-aggregate.sh "$SHARD_RESULT" 4
          fi

  # The queue gate is deliberately light: #204 took the long Windows jobs off
  # merge_group because a required check that never reports on a merge group
  # hangs every entry for the full 120-minute check_response_timeout. That trade
  # left the Windows proof resting on the pull-request run of the queued head
  # commit, with nothing checking that it existed, matched the commit, finished,
  # or passed. This job checks exactly that, in seconds, so the queue keeps its
  # measured p90 of about 12 minutes while stale, missing or mismatched evidence
  # can no longer merge. It is fail-closed: an error exits non-zero rather than
  # letting the change through.
  merge-group-evidence:
    # Runs on every event on purpose. A required check that reports on one event
    # and stays silent on the other is the #204 failure in either direction: a
    # merge group waits out the 120-minute response timeout, or a pull request
    # can never satisfy a context that never reports. Outside the queue this job
    # says so and passes in seconds, so one stable context covers both.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Queued commit carries its own full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != 'merge_group' ]; then
            echo 'Not a merge-queue run: the queued-commit evidence check applies to merge groups only.'
            exit 0
          fi
          bash bin/ai-merge-group-evidence --ref "${{ github.ref }}" --merge-group-sha "${{ github.sha }}" --repo "${{ github.repository }}" --require windows-offline --require windows-reviewer-safety

  # The two whole-repo doc invariants — the public boundary and local Markdown
  # links — are the only checks whose input a prose-only change controls, yet
  # the prose bypass (#805) and the immediate squash-admin lane both skip the
  # offline suites that carry them, and prose paths select no suite even in a
  # mixed pull request. Three 2026-09-30 landings jammed the merge queue that
  # way (#1188: #1171, #1174/#1162, #1178/#1180). This job is unconditional on
  # purpose: no path filter and no classification condition, so it is the
  # opposite of the #1073 hole — every event, prose-only pull requests
  # included, proves the change's own doc content in seconds.
  doc-safety:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Whole-repo public boundary and local Markdown links
        run: |
          bash tests/test-public-boundary.sh
          bash tests/test-markdown-links.sh

  # Ordinary pull requests divide the Windows-sensitive lane into eight declared
  # sections that run at the same time on independent GitHub-hosted
  # machines (#210). Hosted concurrency is unmetered on a public repository, so
  # this is real parallelism on separate hardware, not several processes competing
  # for one desktop - the failure mode the issue explicitly forbids. The section
  # boundaries live in config/ci-suite-manifest.json and are sized from the
  # measured per-suite timings of runs 35200063547 and 35189676116;
  # tests/test-all.sh refuses to run a section unless the declared sections
  # reconstitute the whole lane exactly, so a coverage gap is a configuration
  # error rather than a quiet pass.
  # Extra Windows capacity (owner, 2026-09-23: "why are we saving ENVY? WE
  # NEED TO SPEED THINGS UP!!!"). Idle qualified self-hosted hosts take
  # ordinary Windows sections; everything else stays on the default Windows lane (WarpBuild BYOC). Any lookup
  # failure, or this job failing outright, leaves every section on the default lane.
  runner-router:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      windows_matrix: ${{ steps.route.outputs.windows_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            config/ci-runner-routing.json
            tools/ci/runner-router.cjs
          sparse-checkout-cone-mode: false
      - id: route
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          POOL_TOKEN: ${{ secrets.RUNNER_POOL_READ_TOKEN }}
        with:
          script: |
            const router = require(`${process.env.GITHUB_WORKSPACE}/tools/ci/runner-router.cjs`);
            const cfg = require(`${process.env.GITHUB_WORKSPACE}/config/ci-runner-routing.json`);
            const poolGithub = process.env.POOL_TOKEN ? new github.constructor({ auth: process.env.POOL_TOKEN }) : null;
            await router.run({ github, poolGithub, context, core, cfg });

  windows-offline-section:
    needs: [fast-classifier, manual-preflight, runner-router]
    # Not run on merge_group: linux-offline is the queue gate, and the Windows
    # proof comes from the pull_request run on the exact head commit (#204).
    # Also skipped when the fast classifier proves the change is prose-only.
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs every section.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.run_long != 'false')
    name: windows-offline-section (${{ matrix.section }}, ${{ matrix.lane }})
    strategy:
      # One failing section must never hide the result of the other five:
      # the whole point of sectioning is that a useful failure arrives early
      # and the rest of the evidence still lands.
      fail-fast: false
      # The router's plan; the literal fallback is the all-default plan used
      # when the router produced nothing.
      matrix:
        include: ${{ fromJSON(needs.runner-router.outputs.windows_matrix || '[{"section":1,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":2,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":3,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":4,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":5,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":6,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":7,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}, {"section":8,"lane":"blacksmith","runs_on":"blacksmith-4vcpu-windows-2025"}]') }}
    runs-on: ${{ matrix.runs_on }}
    # Eight sections since 2026-09-29 (#185): section 1 reached this 40-minute
    # ceiling on EDGE-RUNN-ENVY (37-55 minutes), so test-ai-deepseek-agent.sh
    # and test-ai-gh.sh moved to their own sections 7 and 8.
    # Six sections after PR #666's serial Gemini, GLM and Muse Code section
    # reached the 40-minute ceiling. Those three long suites now have distinct
    # sections; GLM shares only three short suites. Kimi stays declared and
    # suspended for re-entry, and every other runnable suite remains assigned.
    timeout-minutes: 40
    env:
      SELECTION_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Shorten TEMP on a reused self-hosted machine
        # The self-hosted profile puts TEMP deep enough that nested suite temp
        # trees cross the 260-char Windows path limit.
        if: ${{ matrix.lane == 'qualified-self-hosted' }}
        shell: pwsh
        run: |
          $short = Join-Path 'C:\t' '${{ github.run_id }}-${{ matrix.section }}'
          New-Item -ItemType Directory -Force -Path $short | Out-Null
          "TEMP=$short" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$short" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Windows-sensitive section ${{ matrix.section }} of 8
        shell: pwsh
        run: |
          .\tests\test-all.ps1 -WindowsPullRequest -ExcludeReviewerSafety -Shard '${{ matrix.section }}/8' -ChangedSince $env:SELECTION_BASE
      - name: Remove the short TEMP tree on a reused machine
        if: ${{ always() && matrix.lane == 'qualified-self-hosted' }}
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path 'C:\t' '${{ github.run_id }}-${{ matrix.section }}')

  # Scheduled, manual and qualification verification stay complete and
  # unsectioned. Sectioning is a wall-clock lever for the pull-request lane; the
  # backstop that proves every suite in one place must not depend on the section
  # mapping being correct.
  windows-offline-complete:
    needs: [fast-classifier, manual-preflight]
    # Not run on merge_group: linux-offline is the queue gate, and the Windows
    # proof comes from the pull_request run on the exact head commit (#204).
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs the complete matrix.
    if: >-
      !cancelled() && github.event_name != 'merge_group' &&
      github.event_name != 'pull_request' &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.run_long != 'false') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true')
    # Blacksmith stays the fixed lane until WarpBuild is fully proven (owner,
    # 2026-10-01: KEEP Blacksmith in the pool; USE it for runs that would
    # otherwise get stuck). The scheduled/manual complete matrix runs five
    # 105-minute sections in parallel, beyond the 2-VM WarpBuild quota.
    runs-on: blacksmith-4vcpu-windows-2025
    # Run 34856869730 reached the existing 105-minute bound in Bash suite
    # 19/74, before PowerShell started. Partition the complete dynamic inventory
    # across independent hosts instead of extending that bound or dropping tests.
    # Every Bash suite runs once; the manifest assigns PowerShell to one section.
    strategy:
      fail-fast: false
      matrix:
        section: [1, 2, 3, 4, 5]
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Complete offline Windows and Bash suites
        shell: pwsh
        run: |
          .\tests\test-all.ps1 -Shard '${{ matrix.section }}/5'

  # One stable aggregate result for the whole Windows offline lane, whatever
  # shape that lane took for this event. The name is deliberately unchanged so
  # #166 can restore `windows-offline` as a required context without having to
  # know how many sections exist. It is fail-closed: a section that did not
  # report success fails the aggregate, and `skipped` is accepted only when the
  # fast classifier actually proved the change was prose-only.
  windows-offline:
    needs: [fast-classifier, manual-preflight, windows-offline-section, windows-offline-complete]
    if: >-
      !cancelled() && github.event_name != 'merge_group'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Aggregate the Windows offline lane
        env:
          EVENT: ${{ github.event_name }}
          SELECTION_RESULT: ${{ needs.fast-classifier.outputs.selection_result }}
          RUN_LONG: ${{ needs.fast-classifier.outputs.run_long }}
          RUN_EXPENSIVE: ${{ needs.manual-preflight.outputs.run_expensive_jobs }}
          SECTION_RESULT: ${{ needs.windows-offline-section.result }}
          COMPLETE_RESULT: ${{ needs.windows-offline-complete.result }}
        run: |
          set -uo pipefail
          printf 'event=%s selection=%s run_long=%s sections=%s complete=%s\n' \
            "$EVENT" "$SELECTION_RESULT" "$RUN_LONG" "$SECTION_RESULT" "$COMPLETE_RESULT"

          # A legitimate whole-lane skip needs an explicit prose-only verdict
          # from a successful selection, or a manual run that declined the
          # expensive jobs. A missing or invalid classification is never a
          # green skip: the lane keeps its fail-closed result.
          prose_only=false
          if [ "$SELECTION_RESULT" = 'success' ] && [ "$RUN_LONG" = 'false' ]; then
            prose_only=true
          fi
          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$RUN_EXPENSIVE" != 'true' ]; then
            prose_only=true
          fi

          if [ "$EVENT" = 'pull_request' ]; then
            lane_result="$SECTION_RESULT"
            lane_name='the eight Windows sections'
          else
            lane_result="$COMPLETE_RESULT"
            lane_name='the complete Windows matrix'
          fi

          if [ "$lane_result" = 'success' ]; then
            printf 'windows-offline: %s succeeded.\n' "$lane_name"
            exit 0
          fi
          if [ "$lane_result" = 'skipped' ] && [ "$prose_only" = true ]; then
            printf 'windows-offline: %s was skipped because the change is prose-only.\n' "$lane_name"
            exit 0
          fi
          printf 'windows-offline: %s reported %s; failing closed.\n' "$lane_name" "$lane_result" >&2
          exit 1

  reviewer-runner-availability:
    needs: [fast-classifier, manual-preflight]
    # Samples ENVY (the qualified pool) for every event that runs the reviewer
    # lane (#736). Busy or offline -> the fallback goes straight to Blacksmith.
    if: >-
      !cancelled() && github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.reviewer != 'false') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      preferred_available: ${{ steps.runners.outputs.preferred_available }}
    steps:
      - name: Check for an idle qualified reviewer host
        id: runners
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ secrets.RUNNER_POOL_READ_TOKEN }}
          script: |
            try {
              const runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForRepo, {
                ...context.repo, per_page: 100
              });
              const available = runners.some(runner =>
                runner.status === 'online' && !runner.busy &&
                runner.labels.some(label => label.name === 'ai-devops-windows-qualified')
              );
              core.setOutput('preferred_available', available ? 'true' : 'false');
              core.info(`Idle qualified reviewer host available=${available}.`);
            } catch (error) {
              core.setOutput('preferred_available', 'false');
              core.warning(`Runner availability is unknown; using the independent hosted proof: ${error.message}`);
            }

  windows-reviewer-preferred:
    needs: [fast-classifier, manual-preflight, reviewer-runner-availability]
    # Not run on merge_group: linux-offline is the queue gate, and the Windows
    # proof comes from the pull_request run on the exact head commit (#204).
    # Also skipped when the fast classifier proves the change does not touch
    # the declared reviewer dependency path set. Classifier failure remains
    # fail-closed and runs the complete reviewer proof.
    if: >-
      !cancelled() && github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.reviewer != 'false') &&
      needs.reviewer-runner-availability.outputs.preferred_available == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true')
    # Deliberate manual diagnostic on the qualified pool. Pull requests and
    # schedules use the independent hosted proof below, so a runner that turns
    # busy after this availability sample can delay only its explicitly chosen
    # manual run, never a required repository check. Moving this job
    # to the GitHub-hosted windows-2025 image was tried on 2026-09-02 and
    # stalled (#204), so this is not a return to hosted runners: it is a move
    # to a dedicated, qualified, otherwise idle machine. The reviewer suite
    # passed 199 of 199 checks in 538s on EDGE-RUNN-ENVY in qualification run
    # 33571202823 - well inside the 30 minute ceiling it exceeded while
    # sharing the edge-dev desktop with windows-offline.
    runs-on: [self-hosted, Windows, X64, ai-devops-windows-qualified]
    concurrency:
      group: ai-devops-windows-reviewer-preferred
      cancel-in-progress: false
    # This lane is preferred evidence, not the required result. A timeout or
    # assertion failure must release the identical hosted fallback, whose
    # stable aggregate below remains fail-closed.
    continue-on-error: true
    timeout-minutes: 60
    outputs:
      proof_result: ${{ steps.proof.outputs.proof_result }}
      codex_result: ${{ steps.proof.outputs.codex_result }}
      grok_result: ${{ steps.proof.outputs.grok_result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline reviewer dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Focused Windows reviewer safety suites
        id: proof
        shell: pwsh
        run: |
          # Preferred stays serial on one host (same-host exclusion). Each suite
          # writes its own result so the hosted fallback is per unproved suite,
          # not a second run of work the preferred host already proved.
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          $resultFile = Join-Path $env:RUNNER_TEMP 'preferred-suite-results.txt'
          $scriptFile = Join-Path $env:RUNNER_TEMP 'preferred-reviewer-suites.sh'
          $resultFilePosix = $resultFile -replace '\\', '/'
          @"
          set -uo pipefail
          c=0
          g=0
          bash tests/test-ai-codex-review.sh || c=`$?
          bash tests/test-ai-grok-review.sh || g=`$?
          {
            if [ "`$c" -eq 0 ]; then echo 'codex_result=success'; else echo 'codex_result=failure'; fi
            if [ "`$g" -eq 0 ]; then echo 'grok_result=success'; else echo 'grok_result=failure'; fi
          } > '$resultFilePosix'
          if [ "`$c" -eq 0 ] && [ "`$g" -eq 0 ]; then
            exit 0
          fi
          exit 1
          "@ | Set-Content -Path $scriptFile -Encoding ascii
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $bash
          $startInfo.UseShellExecute = $false
          $startInfo.WorkingDirectory = $env:GITHUB_WORKSPACE
          $startInfo.ArgumentList.Add($scriptFile -replace '\\', '/')
          $process = [System.Diagnostics.Process]::Start($startInfo)
          if (-not $process.WaitForExit(55 * 60 * 1000)) {
            & .\tools\ci\stop-process-tree.ps1 -TargetProcessId $process.Id -WaitMilliseconds 10000
            if ($LASTEXITCODE -ne 0) {
              "proof_result=cleanup_failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "codex_result=cleanup_failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "grok_result=cleanup_failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Error 'Preferred reviewer timed out, but its process tree could not be proven stopped. Refusing overlapping fallback.'
              exit 0
            }
            "proof_result=timed_out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "codex_result=timed_out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "grok_result=timed_out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning 'Preferred reviewer proof reached its 55-minute bound; hosted fallback is required.'
            exit 0
          }
          $codex = 'failure'
          $grok = 'failure'
          if (Test-Path $resultFile) {
            foreach ($line in Get-Content $resultFile) {
              if ($line -match '^codex_result=(\w+)$') { $codex = $Matches[1] }
              if ($line -match '^grok_result=(\w+)$') { $grok = $Matches[1] }
            }
          }
          "codex_result=$codex" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "grok_result=$grok" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($process.ExitCode -eq 0 -and $codex -eq 'success' -and $grok -eq 'success') {
            "proof_result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "proof_result=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "Preferred reviewer proof failed with exit code $($process.ExitCode); hosted fallback is required for unproved suites."
          }

  reviewer-safety-start-deadline:
    needs: [fast-classifier, manual-preflight, reviewer-runner-availability, windows-reviewer-preferred]
    if: >-
      !cancelled() && github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.reviewer != 'false') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      fallback_required: ${{ steps.watch.outputs.fallback_required }}
      preferred_result: ${{ steps.watch.outputs.preferred_result }}
      fallback_codex: ${{ steps.watch.outputs.fallback_codex }}
      fallback_grok: ${{ steps.watch.outputs.fallback_grok }}
      codex_status: ${{ steps.watch.outputs.codex_status }}
      grok_status: ${{ steps.watch.outputs.grok_status }}
    steps:
      - name: Bound the self-hosted reviewer lane start
        id: watch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          AVAILABLE: ${{ needs.reviewer-runner-availability.outputs.preferred_available }}
          PROOF_RESULT: ${{ needs.windows-reviewer-preferred.outputs.proof_result }}
          CODEX_RESULT: ${{ needs.windows-reviewer-preferred.outputs.codex_result }}
          GROK_RESULT: ${{ needs.windows-reviewer-preferred.outputs.grok_result }}
        with:
          script: |
            const available = process.env.AVAILABLE === 'true';
            const proofResult = process.env.PROOF_RESULT || (available ? 'unknown' : 'unavailable');
            const status = (value) => value || (available ? 'unknown' : 'unavailable');
            const codexStatus = status(process.env.CODEX_RESULT);
            const grokStatus = status(process.env.GROK_RESULT);
            // Per unproved suite: a suite the preferred host already proved (or
            // that left an unclean process tree) never overlaps a hosted twin.
            const needsFallback = (v) => (v === 'success' || v === 'cleanup_failure' ? 'false' : 'true');
            const fallbackCodex = needsFallback(codexStatus);
            const fallbackGrok = needsFallback(grokStatus);
            const fallback = fallbackCodex === 'true' || fallbackGrok === 'true' ? 'true' : 'false';
            core.setOutput('fallback_required', fallback);
            core.setOutput('preferred_result', proofResult);
            core.setOutput('fallback_codex', fallbackCodex);
            core.setOutput('fallback_grok', fallbackGrok);
            core.setOutput('codex_status', codexStatus);
            core.setOutput('grok_status', grokStatus);
            core.info(`Reviewer host available=${available} proof=${proofResult} codex=${codexStatus} grok=${grokStatus}; fallback_codex=${fallbackCodex} fallback_grok=${fallbackGrok}.`);

  # Hosted Codex and Grok proofs run as independent jobs on separate machines
  # (P6). Each job covers exactly one unproved suite, so wall time is near
  # max(individual suites) rather than their sum. Timeouts stay bounded at the
  # existing 60-minute ceiling - this is not a raised limit.
  windows-reviewer-fallback-codex:
    needs: [fast-classifier, manual-preflight, reviewer-safety-start-deadline]
    if: >-
      always() && !cancelled() && github.event_name != 'merge_group' &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.reviewer != 'false') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true') &&
      (needs['reviewer-safety-start-deadline'].result != 'success' ||
       needs['reviewer-safety-start-deadline'].outputs.fallback_codex == 'true')
    # Emergency reviewer fallback: Blacksmith, never the unproven WarpBuild
    # lane (owner, 2026-10-01: USE Blacksmith for runs that would otherwise
    # get stuck).
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Codex reviewer safety suite
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' tests/test-ai-codex-review.sh

  windows-reviewer-fallback-grok:
    needs: [fast-classifier, manual-preflight, reviewer-safety-start-deadline]
    if: >-
      always() && !cancelled() && github.event_name != 'merge_group' &&
      needs.fast-classifier.outputs.validation_result != 'failure' &&
      (needs.fast-classifier.outputs.selection_result != 'success' ||
       needs.fast-classifier.outputs.reviewer != 'false') &&
      (github.event_name != 'workflow_dispatch' ||
       needs.manual-preflight.outputs.run_expensive_jobs == 'true') &&
      (needs['reviewer-safety-start-deadline'].result != 'success' ||
       needs['reviewer-safety-start-deadline'].outputs.fallback_grok == 'true')
    # Emergency reviewer fallback: Blacksmith, never the unproven WarpBuild
    # lane (owner, 2026-10-01: USE Blacksmith for runs that would otherwise
    # get stuck).
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Grok reviewer safety suite
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' tests/test-ai-grok-review.sh

  # Stable required result for reviewer safety. The qualified self-hosted lane
  # remains preferred, but it is not a machine-wide stop: independent hosted
  # fallbacks that run every identical assertion are equally valid proof. Each
  # suite is accepted on its own; one unproved suite fails the aggregate.
  windows-reviewer-safety:
    needs: [fast-classifier, manual-preflight, reviewer-safety-start-deadline, windows-reviewer-fallback-codex, windows-reviewer-fallback-grok]
    if: >-
      !cancelled() && github.event_name != 'merge_group'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Aggregate reviewer safety proof
        env:
          EVENT: ${{ github.event_name }}
          SELECTION_RESULT: ${{ needs.fast-classifier.outputs.selection_result }}
          RUN_REVIEWER: ${{ needs.fast-classifier.outputs.reviewer }}
          RUN_EXPENSIVE: ${{ needs.manual-preflight.outputs.run_expensive_jobs }}
          PREFERRED_RESULT: ${{ needs.reviewer-safety-start-deadline.outputs.preferred_result }}
          WATCHDOG_RESULT: ${{ needs.reviewer-safety-start-deadline.result }}
          CODEX_PREFERRED: ${{ needs.reviewer-safety-start-deadline.outputs.codex_status }}
          GROK_PREFERRED: ${{ needs.reviewer-safety-start-deadline.outputs.grok_status }}
          CODEX_FALLBACK: ${{ needs.windows-reviewer-fallback-codex.result }}
          GROK_FALLBACK: ${{ needs.windows-reviewer-fallback-grok.result }}
        run: |
          set -uo pipefail
          printf 'event=%s selection=%s reviewer=%s preferred=%s watchdog=%s codex_pref=%s grok_pref=%s codex_fb=%s grok_fb=%s\n' \
            "$EVENT" "$SELECTION_RESULT" "$RUN_REVIEWER" "$PREFERRED_RESULT" "$WATCHDOG_RESULT" \
            "$CODEX_PREFERRED" "$GROK_PREFERRED" "$CODEX_FALLBACK" "$GROK_FALLBACK"

          # A legitimate skip needs an explicit "reviewer is not selected"
          # verdict from a successful selection, or a manual run that declined
          # the expensive jobs. Unknown selection is never a green skip.
          legitimate_skip=false
          if [ "$SELECTION_RESULT" = 'success' ] && [ "$RUN_REVIEWER" = 'false' ]; then
            legitimate_skip=true
          fi
          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$RUN_EXPENSIVE" != 'true' ]; then
            legitimate_skip=true
          fi
          if [ "$legitimate_skip" = true ] && [ "$CODEX_FALLBACK" = 'skipped' ] && [ "$GROK_FALLBACK" = 'skipped' ]; then
            printf 'windows-reviewer-safety: reviewer work was legitimately skipped.\n'
            exit 0
          fi

          suite_proved() {
            preferred="$1"
            fallback="$2"
            [ "$preferred" = 'success' ] || [ "$fallback" = 'success' ]
          }

          all_ok=true
          if ! suite_proved "$CODEX_PREFERRED" "$CODEX_FALLBACK"; then
            printf 'windows-reviewer-safety: codex suite unproved (preferred=%s fallback=%s).\n' \
              "$CODEX_PREFERRED" "$CODEX_FALLBACK" >&2
            all_ok=false
          fi
          if ! suite_proved "$GROK_PREFERRED" "$GROK_FALLBACK"; then
            printf 'windows-reviewer-safety: grok suite unproved (preferred=%s fallback=%s).\n' \
              "$GROK_PREFERRED" "$GROK_FALLBACK" >&2
            all_ok=false
          fi

          if [ "$all_ok" = true ]; then
            printf 'windows-reviewer-safety: every reviewer suite is proved.\n'
            exit 0
          fi

          printf 'windows-reviewer-safety: no complete reviewer proof; preferred=%s watchdog=%s codex_fb=%s grok_fb=%s.\n' \
            "$PREFERRED_RESULT" "$WATCHDOG_RESULT" "$CODEX_FALLBACK" "$GROK_FALLBACK" >&2
          exit 1

  # The ruleset requires this one stable context on both pull_request and
  # merge_group. On a pull request it closes over every exact-head platform and
  # reviewer proof before GitHub may admit the change to the queue. In the
  # queue it closes over the fresh Linux run and merge-group-evidence, so an
  # evidence refusal cannot be hidden by an unrelated green required job.
  verification-closure:
    needs: [fast-classifier, merge-group-evidence, doc-safety, linux-offline, windows-offline, windows-reviewer-safety]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Close every required verification path
        run: |
          bash tools/ci/verify-closure.sh \
            "${{ github.event_name }}" \
            "${{ needs.fast-classifier.outputs.selection_result }}" \
            "${{ needs.fast-classifier.outputs.run_long }}" \
            "${{ needs.fast-classifier.outputs.validation_result }}" \
            "${{ needs.merge-group-evidence.result }}" \
            "${{ needs.linux-offline.result }}" \
            "${{ needs.windows-offline.result }}" \
            "${{ needs.windows-reviewer-safety.result }}" \
            "${{ needs.doc-safety.result }}"

  report-scheduled-failure:
    needs: [fast-classifier, linux-offline, windows-offline-complete, windows-reviewer-safety]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Open or update the scheduled verification incident
        shell: bash
        run: |
          needs_summary=""
          for pair in \
            "fast-classifier=${{ needs.fast-classifier.result }}" \
            "linux-offline=${{ needs.linux-offline.result }}" \
            "windows-offline-complete=${{ needs.windows-offline-complete.result }}" \
            "windows-reviewer-safety=${{ needs.windows-reviewer-safety.result }}"; do
            needs_summary="$needs_summary$pair "
          done
          bash tools/ci/report-scheduled-failure.sh \
            --run-url "$RUN_URL" \
            --repo "$GITHUB_REPOSITORY" \
            --results "$needs_summary"
