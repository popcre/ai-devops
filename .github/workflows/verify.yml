name: verify

on:
  push:
    branches: [main]
  pull_request:
  # Required for the merge queue: without this trigger a queued pull request
  # waits forever for checks that never start.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  # A pull request is keyed on its *number*, not its head SHA. Keying on the SHA
  # made every new commit its own group, so cancel-in-progress could never fire
  # across pushes and the two-runner Windows pool filled with builds nobody was
  # waiting for (issue #204: nine queued runs for six commits on one branch).
  #
  # merge_group keeps its own per-queue-branch group and push: main keeps its
  # per-SHA group, so concurrent queue entries never cancel one another and each
  # immutable commit on main still gets its own preserved proof (commit 817f8069).
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-classifier:
    uses: ./.github/workflows/fast-classifier.yml

  linux-offline:
    needs: fast-classifier
    if: always() && (needs.fast-classifier.result != 'success' || needs.fast-classifier.outputs.run_long == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install offline test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck
      - name: Syntax
        run: |
          find bin tests -type f \( -name '*.sh' -o -path 'bin/ai-*' \) | while read -r file; do
            head -n 1 "$file" | grep -q 'bash' || continue
            bash -n "$file"
          done
      - name: Complete offline Bash suite
        run: bash tests/test-all.sh

  windows-offline:
    needs: fast-classifier
    # Not run on merge_group: the edge-dev pool is two logical runners on one
    # physical machine, and a queue rebuild restarted this job five times for a
    # single pull request (issue #204). linux-offline is the queue gate; the
    # Windows proof comes from the pull_request run on the exact head commit.
    # Also skipped when the fast classifier proves the change is prose-only.
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs the complete matrix.
    if: >-
      always() && github.event_name != 'merge_group' &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true')
    # Self-hosted on edge-dev. Every failure this repository has had to
    # investigate has been a Windows timing flake, and GitHub-hosted runners made
    # them unreproducible: a different machine every time, and two days of runs
    # that produced no usable evidence. A known, constant machine is what these
    # timing-sensitive suites need. Note the label currently resolves to two
    # logical runners on one physical host, so the two Windows jobs can contend
    # for the same cores outside the serialization mutex; #209 owns that.
    runs-on: [self-hosted, Windows, X64, edge-dev]
    # Measured bound, not a guess. Run 33479765150 completed the identical
    # body in 62m on an otherwise idle EDGE-DEV. Run 33541520697 was killed at
    # 75m having finished 17 of 61 Bash suites, and every one of those suites,
    # including one-second suites, ran about 2x its idle time. That uniform
    # ratio is host contention from non-CI work on the shared machine, not a
    # hung suite, so the bound must cover a contended run: 62m x 2 plus modest
    # headroom. It stays finite and fail-closed, and #209 (independent hosts)
    # plus #162 (duplicate removal) are what bring it back down.
    # This job may first wait up to 90 minutes for the shared physical host, so
    # the job-level envelope covers both bounds plus setup/teardown.
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Complete offline Windows and Bash suites
        shell: pwsh
        run: |
          . .\tools\ci\edge-dev-serialization.ps1
          Invoke-EdgeDevSerialized -BodyMinutes 150 -Body { & pwsh -NoProfile -File .\tests\test-all.ps1 }

  windows-reviewer-safety:
    needs: fast-classifier
    # Not run on merge_group: the edge-dev pool is two logical runners on one
    # physical machine, and a queue rebuild restarted this job five times for a
    # single pull request (issue #204). linux-offline is the queue gate; the
    # Windows proof comes from the pull_request run on the exact head commit.
    # Also skipped when the fast classifier proves the change is prose-only.
    # Fail-closed: any classifier result other than a clean prose-only verdict
    # runs the complete matrix.
    if: >-
      always() && github.event_name != 'merge_group' &&
      (needs.fast-classifier.result != 'success' ||
       needs.fast-classifier.outputs.run_long == 'true')
    runs-on: [self-hosted, Windows, X64, edge-dev]
    # This may wait behind the complete job from any workflow run before its
    # own 30-minute measured work. The host mutex preserves every queued job.
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify offline reviewer dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            throw 'The pinned Windows runner image does not provide jq.'
          }
      - name: Focused Windows reviewer safety suites
        shell: pwsh
        run: |
          . .\tools\ci\edge-dev-serialization.ps1
          Invoke-EdgeDevSerialized -BodyMinutes 30 -Body {
            $bash = 'C:\Program Files\Git\bin\bash.exe'
            $failures = 0
            foreach ($test in @('tests/test-ai-codex-review.sh', 'tests/test-ai-grok-review.sh')) {
              & $bash $test
              if ($LASTEXITCODE -ne 0) { $failures++ }
            }
            if ($failures -ne 0) { throw "$failures focused reviewer suite(s) failed." }
          }

  report-scheduled-failure:
    needs: [fast-classifier, linux-offline, windows-offline, windows-reviewer-safety]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the scheduled verification incident
        shell: bash
        run: |
          title='Scheduled full verification is failing'
          body="The complete scheduled matrix failed at $RUN_URL. Diagnose the named failing job and close this issue only after a later complete scheduled run passes."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug
          fi
