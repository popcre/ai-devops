name: Reviewer membership drift

# DISABLED (#2073, skinny review): the rotation registry and the shared-db
# allocator are retired, so this drift alarm has no schedule and no PR
# trigger. Manual dispatch only; the workflow and its tool go in stage F.
on:
  workflow_dispatch:

jobs:
  drift:
    name: Registry matches shared-db allocator
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Offline test
        run: bash tests/test-ai-reviewer-membership-drift.sh
      - name: Compare with shared-db main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/ai-reviewer-membership-drift.cjs
