name: Reviewer membership drift

# Fails when config/reviewer-registry.json and the shared-db allocator
# (u2giants/shared-db scripts/manage-migration-author-lanes.mjs on main)
# disagree about rotation membership. Not a required check: a red run is an
# alarm to fix both sides in one change, not a merge blocker for unrelated work.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - config/reviewer-registry.json
      - config/reviewer-membership-scope.json
      - bin/ai-reviewer-membership-drift
      - tests/test-ai-reviewer-membership-drift.sh

jobs:
  drift:
    name: Registry matches shared-db allocator
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Offline test
        run: bash tests/test-ai-reviewer-membership-drift.sh
      - name: Compare with shared-db main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/ai-reviewer-membership-drift
