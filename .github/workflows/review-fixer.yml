name: review-fixer

# Automatic fixer for `review-finding` issues opened by ai-review.yml
# (plan_simple-reviewer-rebuild.md REVISION phase A). A headless Codex run on
# edge-dev3 judges each finding, fixes the real ones on review-fix/<issue> and
# opens a PR, or closes the issue as not planned. Fix PRs are never reviewed
# (ai-review skips review-fix/* heads), so this cannot loop. Agent credentials
# stay in the runner user's own login, never here.
# Source/branch update events only retire stale fix PRs. They never start a
# model. Each repository/target branch has one publisher across all entrypoints.

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [synchronize, closed]
  push:
  delete:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: review-finding issue number (empty = every pending one)
        required: false
        type: string
  # Other repositories call this workflow from their own review-fixer.yml
  # (stage G of plan_skinny-review.md), passing their issue and runner labels.
  workflow_call:
    inputs:
      issue:
        description: review-finding issue number (empty = every pending one)
        required: false
        type: string
      runner_labels:
        description: JSON list of runner labels (a self-hosted runner where Codex is logged in)
        type: string
        default: '["self-hosted", "ai-devops-linux"]'

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'issues' || github.event.label.name == 'review-finding'
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted", "ai-devops-linux"]') }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: popcre/ai-devops
          ref: main
          path: toolkit
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          matrix="$(python3 toolkit/tools/ci/review-fixer-state.py plan "$ISSUE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fix:
    name: review-fixer-${{ matrix.key }}
    needs: prepare
    if: >-
      needs.prepare.outputs.matrix != '{"include": []}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # All entry points, including sweeps and cleanup, share the same target
    # lock. Replaced pending jobs lose no finding: the next sweep lists every
    # still-open unhandled issue, rather than relying on a one-shot event.
    concurrency:
      group: review-fixer-${{ github.repository }}-${{ matrix.key }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted", "ai-devops-linux"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
      ISSUES: ${{ toJSON(matrix.issues) }}
      PYTHONDONTWRITEBYTECODE: '1'
      AI_GH_SIGNATURE: Posted by review-fixer workflow run ${{ github.run_id }}
      REVIEW_FIXER_TRUSTED_ROOT: ${{ github.workspace }}/caller-trusted
    steps:
      - name: Check out the fixer (trusted popcre/ai-devops main, never the caller)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: popcre/ai-devops
          ref: main
          path: toolkit
          persist-credentials: false
      - name: Check out trusted caller lifecycle adapters (default branch only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: caller-trusted
          persist-credentials: false
      - name: Fix pending review findings
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 toolkit/tools/ci/review-fixer-state.py retire "$TARGET" || exit 1
          todo="$(jq -r '.[]' <<< "$ISSUES")"
          status=0
          for n in $todo; do
            labels="$(bash toolkit/bin/ai-gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json state,labels \
              --jq '.state + " " + ([.labels[].name] | join(","))')"
            case "$labels" in
              OPEN\ *review-finding*) ;;
              *) echo "#$n: not an open review-finding issue; skipped"; continue ;;
            esac
            case "$labels" in *fixer-done*|*fixer-failed*|*fixer-deferred*) echo "#$n: already handled"; continue ;; esac
            echo "::group::issue #$n"
            bash toolkit/tools/ci/review-fixer.sh "$n" || status=1
            echo "::endgroup::"
          done
          exit "$status"
