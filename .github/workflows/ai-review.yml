name: ai-review

# Advisory AI review (#2041, plan_simple-reviewer-rebuild.md REVISION phase A).
# One reviewer per PR, picked by PR number mod 4 over muse, glm, deepseek,
# stepfun, falling through to the next on unavailable. It runs once per PR,
# skips docs-only PRs, posts one comment and records an `ai-review` check that
# is success or neutral, never failure. A REJECT or REVISE opens a
# `review-finding` issue for the automatic fixer (review-fixer.yml).
# Provider keys stay in runner-local config, never here.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_call:
    inputs:
      toolkit_ref:
        description: popcre/ai-devops ref that supplies the review script
        type: string
        default: main
      runner_labels:
        description: JSON list of runner labels for the review job (a self-hosted runner holding the provider keys)
        type: string
        default: '["self-hosted", "ai-devops-linux"]'

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The job is named `review` so the only `ai-review` check is the advisory
  # one recorded below. Every step tolerates errors: the job never fails.
  review:
    # Same-repository PRs only: the runners hold provider keys. Fixer PRs
    # (review-fix/*) are never reviewed, so findings cannot loop.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'review-fix/')
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted", "ai-devops-linux"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PYTHONDONTWRITEBYTECODE: '1'
      AI_GH_SIGNATURE: Posted by ai-review workflow run ${{ github.run_id }}
    steps:
      - name: Check out the review toolkit (trusted ref, never the PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: popcre/ai-devops
          ref: ${{ inputs.toolkit_ref || 'main' }}
          path: toolkit
          persist-credentials: false
      - name: Classify the change
        id: classify
        continue-on-error: true
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          docs="$(python3 toolkit/bin/ai-review-simple --docs-only "$RUNNER_TEMP/files.txt")"
          echo "docs_only=$docs" >> "$GITHUB_OUTPUT"
          if [ "$docs" = true ]; then
            jq -n --arg sha "$HEAD_SHA" '{name: "ai-review", head_sha: $sha, status: "completed",
              conclusion: "success", output: {title: "review not needed (docs only)",
              summary: "Every changed file is documentation, so no AI review runs."}}' \
              | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
            echo "ai-review: review not needed (docs only)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the PR head
        if: steps.classify.outputs.docs_only != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Review with one rotating reviewer
        continue-on-error: true
        if: steps.classify.outputs.docs_only != 'true'
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          script="$GITHUB_WORKSPACE/toolkit/bin/ai-review-simple"
          base="$(git -C pr merge-base "$BASE_SHA" "$HEAD_SHA")"
          mkdir -p results; : > results/order
          for p in $(python3 "$script" --rotation "$PR"); do
            echo "$p" >> results/order
            rc=0
            python3 "$script" --provider "$p" --repo pr --base "$base" --head "$HEAD_SHA" \
              --out "results/$p.json" || rc=$?
            echo "$p: ai-review-simple exit $rc (0 verdict, 3 unavailable, 2 refused)"
            [ "$rc" = 0 ] && break
          done
          exit 0
      - name: Comment, record the check, open a finding issue
        continue-on-error: true
        if: steps.classify.outputs.docs_only != 'true' && !cancelled()
        run: |
          set -euo pipefail
          script=toolkit/bin/ai-review-simple
          mkdir -p results
          [ -s results/order ] || printf '%s\n' muse > results/order
          files=(); while read -r p; do files+=("results/$p.json"); done < results/order
          summary="$(python3 "$script" --combine "${files[@]}" --head "$HEAD_SHA" --comment-out comment.md)"
          echo "$summary"
          state="$(jq -r .state <<<"$summary")"
          reviewer="$(jq -r '.reviewer // "none"' <<<"$summary")"
          # Advisory: never a failure.
          case "$state" in pass) conclusion=success ;; *) conclusion=neutral ;; esac
          jq -n --arg sha "$HEAD_SHA" --arg c "$conclusion" --arg t "ai-review: $state ($reviewer)" \
            --rawfile body comment.md \
            '{name: "ai-review", head_sha: $sha, status: "completed", conclusion: $c,
              output: {title: $t, summary: $body[0:60000]}}' \
            | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md || \
            echo "::warning::could not post the review comment"
          echo "ai-review: $state ($reviewer)" >> "$GITHUB_STEP_SUMMARY"
          [ "$state" = findings ] || exit 0
          gh label create review-finding --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "AI review finding for the automatic fixer" 2>/dev/null || true
          {
            printf 'PR: %s\nHead SHA: `%s`\nReviewer: %s\n\n## Findings\n\n' "$PR_URL" "$HEAD_SHA" "$reviewer"
            jq -r '.findings // "No findings text recorded."' "results/$reviewer.json"
            printf '\n\n%s\n' "$AI_GH_SIGNATURE"
          } > issue.md
          url="$(gh issue create --repo "$GITHUB_REPOSITORY" --label review-finding \
            --title "Review finding: $GITHUB_REPOSITORY#$PR $PR_TITLE" --body-file issue.md)" || {
            echo "::warning::could not open the review-finding issue"; exit 0; }
          echo "Opened $url"
          # Issues opened with the workflow token fire no `issues` event, so
          # start the fixer directly; the 2-hour schedule is the backstop.
          if [ -f .github/workflows/review-fixer.yml ] || \
             gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/review-fixer.yml" >/dev/null 2>&1; then
            gh workflow run review-fixer.yml --repo "$GITHUB_REPOSITORY" -f issue="${url##*/}" || \
              echo "::warning::could not start the review fixer; the schedule will pick it up"
          fi
