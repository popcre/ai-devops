name: windows-queue-watchdog

# BACKUP ONLY. The primary queue-slow alarm is the local timed task
# `ai-windows-queue-watch` on the watchdog duty pool (edge-dev / edge-dev3 /
# hetz; docs/watchdog-duty-pool.md). This workflow stays as a rare free-runner
# smoke and manual dispatch. It never uses a paid runner.
#
# What it does when dispatched: runs one `ai-windows-queue-watch scan` pass and
# leaves a single marker comment on any pull request whose Windows sections
# stayed queued past the threshold. Primary cadence is the 2-minute local tick.
on:
  workflow_dispatch:
  schedule:
    # Weekly smoke on a free runner (claim-stale backup is optional; weekly is
    # the cheap heartbeat). Minute 41 stays off other crons.
    - cron: '41 13 * * 1'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  backup-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: One backup scan (same tool as the local tick)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin/ai-windows-queue-watch scan
